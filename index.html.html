*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--t1);font:400 16px/1.45 "Instrument Sans",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.logo{width:38px;height:38px;background:var(--logo) center/contain no-repeat}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1080px;margin:auto;padding:0 20px 12px;scrollbar-width:none}
.tab{padding:8px 14px;border-radius:10px;background:var(--nest);color:var(--t2);font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.tab[aria-selected=true]{background:var(--pri);color:#fff}
.tog{padding:8px 14px;border-radius:10px;background:var(--sec);color:var(--sect);font-weight:600}
main{max-width:1080px;margin:auto;padding:24px 20px 64px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.08;letter-spacing:-.02em;font-weight:600;max-width:18ch}
h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--t2);max-width:56ch;margin-top:12px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}
.strip div{background:var(--card);border-radius:var(--r);padding:14px 16px}
.strip small,.meta{color:var(--mut);font-size:13px}.strip b{display:block;font-weight:500;margin-top:2px}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-top:8px}
.row{background:var(--nest);border-radius:var(--r2);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-top:6px;position:relative;overflow:hidden}
.row:first-child{margin-top:0}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--sec);transition:width .7s cubic-bezier(.2,.8,.2,1);z-index:0}
.row>*:not(.fill){position:relative;z-index:1}.grow{flex:1;min-width:0}.pct{font-weight:600;font-variant-numeric:tabular-nums}
.q{display:flex;gap:14px;align-items:center;padding:14px 16px}.q .ic{width:48px;height:48px;border-radius:12px;background:var(--markw) center/66% no-repeat,radial-gradient(circle at 50% 45%,#26183c,#0d0b18);flex:none}
.q h3{font-size:17px;font-weight:500}
.btn{border-radius:var(--r2);padding:12px 18px;font-weight:600;text-align:center}
.up{background:var(--pri);color:#fff}.down{background:var(--sec);color:var(--sect)}
.sm{padding:6px 14px;border-radius:8px;font-size:14px}
.chip{padding:8px 14px;border-radius:10px;background:var(--nest);color:var(--t2);font-size:14px}.chip.on{background:var(--sec);color:var(--sect);font-weight:600}
.badge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--sec);color:var(--sect)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.foot{display:flex;gap:12px;color:var(--mut);font-size:14px;padding:10px 16px 4px}
.hero{padding:28px 0 8px}.eco{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px;margin-top:16px}
.eco button{text-align:left;background:var(--card);border-radius:var(--r);padding:18px;transition:transform .2s}.eco button:hover{transform:translateY(-2px)}
.eco p{color:var(--t2);font-size:14px;margin-top:4px}
.scr{display:none}.scr.on{display:block}
.big{font-size:40px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media(max-width:700px){.strip,.g2,.g3{grid-template-columns:1fr}.row{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:32px 0 10px;flex-wrap:wrap}
.inp{background:var(--nest);color:var(--t1);border:0;border-radius:12px;padding:12px 14px;font:inherit;width:100%}
label{display:block;color:var(--t2);font-size:14px;margin-top:14px}label .inp{margin-top:6px}
.tools{display:grid;gap:10px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{transition:background .2s,color .2s,transform .15s}.chip:hover{color:var(--t1)}.chip.big{display:inline-flex;gap:8px;align-items:center;background:var(--card);padding:10px 16px}.chip.big small{background:var(--nest);border-radius:6px;padding:1px 7px}
.btn{transition:transform .15s,filter .2s}.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.96)}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block}
.tok{background:var(--c);color:#fff;border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;opacity:.55;transition:opacity .2s,transform .15s}.tok:hover,.tok.on{opacity:1}.tok.on{transform:scale(1.06)}
.seg{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px}.seg button{padding:8px 14px;border-radius:9px;color:var(--t2);transition:background .2s,color .2s}.seg .on{background:var(--sec);color:var(--sect);font-weight:600}
.rbars{background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 25%)}
.rr{display:grid;grid-template-columns:110px 1fr;align-items:center;padding:14px 0}.rt{display:flex;align-items:center;gap:8px}.lab{font-size:13px;white-space:nowrap}.lab small{color:var(--mut)}
.pbar{display:block;height:4px;border-radius:4px;background:var(--c);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}.pbar.thick{height:10px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}

function anim(r){$$('.in',r).forEach((e,i)=>e.style.setProperty('--i',Math.min(i,14)));requestAnimationFrame(()=>requestAnimationFrame(()=>{$$('[data-w]',r).forEach(e=>e.style.width=e.dataset.w+'%');$$('[data-n]',r).forEach(count)}))}
function count(e){const n=+e.dataset.n,d=+e.dataset.d,s=e.dataset.s,p=e.dataset.p,f=v=>p+v.toFixed(d)+s;if(RM){e.textContent=f(n);return}const t0=performance.now();(function k(t){const x=Math.min(1,(t-t0)/800),y=1-Math.pow(1-x,3);e.textContent=f(n*y);if(x<1)requestAnimationFrame(k)})(t0)}
function rr(id){const s=S.find(x=>x.id==id);$('#b-'+id).innerHTML=s.b();anim($('#s-'+id))}
function go(id){st.cur=id;$$('.scr').forEach(e=>e.classList.toggle('on',e.id=='s-'+id));$$('#tabs .tab').forEach(e=>e.setAttribute('aria-selected',e.dataset.p==(id=='home'?'home':'app')));$$('#subtabs .tab').forEach(e=>e.setAttribute('aria-selected',e.dataset.id==id));$('#subtabs').classList.toggle('off',id=='home');rr(id);hero(id);pill();scrollTo({top:0,behavior:RM?'auto':'smooth'});try{location.hash=id}catch(e){}}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.append(t)}const n=document.createElement('div');n.className='tst';n.textContent=m;t.append(n);setTimeout(()=>n.remove(),2600)}
function openM(h){closeM();const d=document.createElement('div');d.className='mod';d.id='mod';d.innerHTML=`<div class="mbg" data-a="mclose"></div><div class="mbox" role="dialog" aria-modal="true">${h}</div>`;document.body.append(d);const f=$('input,select,button',$('.mbox',d));f&&f.focus()}
function closeM(){const d=$('#mod');d&&d.remove()}
const opt=(l,c)=>l.map(x=>`<option ${x==c?'selected':''}>${x}</option>`).join('');
const ACT={
wallet(){st.w=!st.w;upHW();toast(st.w?'Wallet connected: 0x4a…91c':'Wallet disconnected');rr(st.cur)},
go(v){go(v)},cat(v){st.cat=v;rr('app')},lb(v){st.lb=v;rr('app')},tr(v){st.tr=v;rr('deep')},
org(v){st.org=st.org==v?'All':v;rr('futarchy')},ff(v){st.ff=v;rr('futarchy')},

msub(v){const q=$('#cq').value.trim();if(!q)return toast('Add a question first');const ty=$('#ct').value,c=$('#cc')?$('#cc').value:'Futarchy';

ask(){const v=$('#ask').value.trim();if(!v)return toast('Type a question first');st.q=v;st.cat='All';go('app');toast('Searching existing markets')},
trade(){st.w?toast('Position placed. This demo moves no funds.'):toast('Connect a wallet to trade')},
